# Codemagic baut Saatzeit in der Cloud.
# - ios-test:     unsignierte .ipa, danach mit Sideloadly und einer normalen Apple-ID aufs iPhone (7 Tage gültig)
# - android-test: Test-APK, lässt sich direkt auf jedem Android-Handy installieren
workflows:
  android-test:
    name: Saatzeit Android-Test (APK)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      java: 21
    scripts:
      - name: Pakete installieren
        script: npm install
      - name: Android-Projekt erzeugen
        script: |
          # Capacitor-Grundbibliothek für die App ohne Bundler bereitstellen
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          node scripts/android-setup.mjs
      - name: APK bauen
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/Saatzeit-test.apk"
    artifacts:
      - Saatzeit-test.apk


  ios-test:
    name: Saatzeit iPhone-Test (unsigniert)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Pakete installieren
        script: npm install
      - name: iOS-Projekt erzeugen
        script: |
          # Capacitor-Grundbibliothek für die App ohne Bundler bereitstellen
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios
      - name: App-Store-Angaben eintragen
        script: |
          # Datenschutz-Manifest, nur iPhone, Versionsnummer, Info.plist: ITSAppUsesNonExemptEncryption = NO
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document
          ruby scripts/ios-setup.rb
      - name: App bauen (ohne Signatur)
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            TARGET="-workspace ios/App/App.xcworkspace"
          else
            TARGET="-project ios/App/App.xcodeproj"
          fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/Saatzeit.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
      - name: IPA verpacken
        script: |
          mkdir -p Payload
          cp -R "$CM_BUILD_DIR/build/Saatzeit.xcarchive/Products/Applications/App.app" Payload/
          zip -qry Saatzeit-unsigniert.ipa Payload
    artifacts:
      - Saatzeit-unsigniert.ipa
